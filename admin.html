        .edit-modal {

}

.edit-modal.show {

}

.edit-modal-content {
    width: 100%;
    max-width: 500px;
    background: #151518;
    border: 1px solid #2a2a2f;
    border-radius: 22px;
    padding: 25px;

}

.edit-modal-content h2 {

    margin-bottom: 20px;
}

.edit-modal-content input {

.edit-close {

}

        .add-modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    padding: 20px;
}

.add-modal.show {
    display: flex;
}

.add-modal-content {
    position: relative;
    width: 100%;
    max-width: 500px;
    max-height: 90vh;
    overflow-y: auto;
    background: #151518;
    border: 1px solid #29292e;
    border-radius: 20px;
    padding: 25px;

}

.add-title {
    font-size: 24px;
    font-weight: 800;
    margin-bottom: 20px;
}

.add-input {
    width: 100%;
    background: #202024;
    border: 1px solid #303035;
    border-radius: 12px;
    padding: 13px 14px;
    color: white;
    font-size: 14px;
    outline: none;
    margin-bottom: 12px;
    font-family: Arial, sans-serif;
}

.add-input:focus {
    border-color: #555;
}

.add-input::placeholder {
    color: #777;
}

.add-textarea {
    min-height: 100px;
    resize: vertical;
}

.add-close {
    position: absolute;
    top: 15px;
    right: 15px;
    width: 36px;
    height: 36px;
    border: none;

}

    width: 100%;
    border: none;
    background: white;

    border-radius: 12px;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    margin-top: 5px;
}

.add-save:hover {
    opacity: 0.9;

<body>

    <div class="admin">

        <div class="logo">
            dr1ft_shop
        </div>

        <div class="subtitle">
            Панель управления
        </div>
        

        <div class="admin-card">

            <h2>
                Товары
            </h2>

            <div id="productsList"></div>

            <button
                class="admin-button"
                onclick="addProduct()"
            >
                ＋ Добавить товар
            </button>

        </div>

        <div class="admin-card">

            <h2>
                Заказы
            </h2>

            <div style="color:#888;">
                Пока заказов нет
            </div>

        </div>

        <button
    class="logout-button"
    onclick="logoutAdmin()"
>
    Выйти
</button>

    </div>

    

    <script>

        const products = [];

const productsList = document.getElementById("productsList");
        console.log("PRODUCTS LIST:", productsList);

        async function loadProductsFromSupabase() {

    const { data, error } = await supabaseClient
        .from("products")
        .select("*")
        .order("created_at", { ascending: true });

    if (error) {
        console.error("Ошибка загрузки товаров из Supabase:", error);
        return;
    }

    products.splice(
        0,
        products.length,
        ...data
    );

            console.log("SUPABASE PRODUCTS:", data);
            console.log("PRODUCTS BEFORE RENDER:", products);

    renderProducts();
}

    async function addProduct() {

    const name = prompt("Введите название товара:");

    if (!name) {
        return;
    }

    const price = prompt("Введите цену товара:");

    if (!price) {
        return;
    }

    const image = prompt("Введите имя файла изображения:");

    if (!image) {
        return;
    }

    const sizesInput = prompt(
        "Введите размеры через запятую (например: S, M, L, XL):"
    );

    if (!sizesInput) {
        return;
    }

    const sizes = sizesInput
        .split(",")
        .map(size => size.trim())
        .filter(size => size);

    const { data, error } = await supabaseClient
        .from("products")
        .insert({
            name: name,
            price: price,
            image: image,
            sizes: sizes
        })
        .select()
        .single();

    if (error) {
        console.error("Ошибка добавления товара:", error);
        alert("Не удалось добавить товар.");
        return;
    }

    console.log("Товар добавлен в Supabase:", data);

    await loadProductsFromSupabase();

    alert("Товар успешно добавлен!");
}

        let editingProduct = null;

function editProduct(name) {

    const product = products.find(
        product => product.name === name
    );

    if (!product) {
        return;
    }

    if (!product.id) {
        alert("У товара нет ID в Supabase.");
        console.error("Товар без ID:", product);
        return;
    }

    editingProduct = product;

    document.getElementById("editName").value = product.name;
    document.getElementById("editPrice").value = product.price;
    document.getElementById("editImage").value = product.image;

    document.getElementById("editSizes").value = product.sizes
        ? product.sizes.join(", ")
        : "";

    const imagePreview =
        document.getElementById("editImagePreview");

    imagePreview.src = product.image;
    imagePreview.style.display = "block";

    document.getElementById("editModal").classList.add("show");
}

        function updateImagePreview() {

    const image = document.getElementById("editImage").value.trim();
    const preview = document.getElementById("editImagePreview");

    if (!image) {
        preview.style.display = "none";
        return;
    }

    preview.src = image;
    preview.style.display = "block";

}

        function closeEditModal() {

    document.getElementById("editModal").classList.remove("show");

}


        async function saveEditProduct() {

    if (!editingProduct) {
        return;
    }

    const newName = document.getElementById("editName").value.trim();
    const newPrice = document.getElementById("editPrice").value.trim();
    const newImage = document.getElementById("editImage").value.trim();
    const sizesInput = document.getElementById("editSizes").value.trim();

    if (!newName || !newPrice || !newImage || !sizesInput) {
        alert("Заполните все поля.");
        return;
    }

    const newSizes = sizesInput
        .split(",")
        .map(size => size.trim())
        .filter(size => size);

    const { data, error } = await supabaseClient
        .from("products")
        .update({
            name: newName,
            price: newPrice,
            image: newImage,
            sizes: newSizes
        })
        .eq("id", editingProduct.id)
        .select();

    if (error) {
        console.error("Ошибка обновления товара:", error);
        alert("Не удалось сохранить изменения.");
        return;
    }

    console.log("Товар обновлён в Supabase:", data);

    await loadProductsFromSupabase();

    closeEditModal();

    editingProduct = null;

    alert("Товар успешно обновлён!");
}
        

      async function deleteProduct(name) {

    const confirmDelete = confirm(
        "Удалить товар " + name + "?"
    );

    if (!confirmDelete) {
        return;
    }

    const product = products.find(
        product => product.name === name
    );

    if (!product) {
        return;
    }

    if (!product.id) {
        alert("У товара нет ID в Supabase.");
        return;
    }

    const { error } = await supabaseClient
        .from("products")
        .delete()
        .eq("id", product.id);

    if (error) {
        console.error("Ошибка удаления товара:", error);
        alert("Не удалось удалить товар.");
        return;
    }

    await loadProductsFromSupabase();

    alert("Товар успешно удалён!");
}
        

function renderProducts() {

    productsList.innerHTML = "";

    products.forEach(product => {

        productsList.innerHTML += `
            <div style="
                display:flex;
                align-items:center;
                gap:15px;
                margin-bottom:15px;
                padding:12px;
                background:#202024;
                border-radius:14px;
            ">

                <img
                    src="${product.image}"
                    style="
                        width:70px;
                        height:70px;
                        object-fit:cover;
                        border-radius:10px;
                    "
                >

                <div>

                    <div style="
                        font-weight:700;
                        margin-bottom:5px;
                    ">
                        ${product.name}
                    </div>

                    <div style="color:#aaa;">
                        ${product.price}
                    </div>

                    <button
                        onclick="editProduct('${product.name}')"
                        style="
                            margin-top:10px;
                            background:white;
                            color:black;
                            border:none;
                            padding:8px 12px;
                            border-radius:8px;
                            font-weight:700;
                            cursor:pointer;
                        "
                    >
                        ✏️ Изменить
                    </button>

                    <button
                        onclick="deleteProduct('${product.name}')"
                        style="
                            margin-top:10px;
                            margin-left:5px;
                            background:#ff4444;
                            color:white;
                            border:none;
                            padding:8px 12px;
                            border-radius:8px;
                            font-weight:700;
                            cursor:pointer;
                        "
                    >
                        🗑 Удалить
                    </button>

                </div>

            </div>
        `;

    });

}

        renderProducts();
        
    </script>

    <div id="editModal" class="edit-modal">

    <div class="edit-modal-content">

        <button

    "
>

<input

    type="text"

<button
    class="edit-save"

>

</button>

</div>

async function checkAdminAuth() {
    const { data: { user } } = await supabaseClient.auth.getUser();

    if (!user) {
        window.location.href = "admin-login.html";
        return;
    }

    loadProductsFromSupabase();
    console.log("SUPABASE LOAD STARTED");
}

    async function logoutAdmin() {
    await supabaseClient.auth.signOut();
    window.location.href = "admin-login.html";
}
    
</script>
